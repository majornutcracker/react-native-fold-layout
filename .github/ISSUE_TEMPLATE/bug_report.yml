name: Bug report
description: Something in the module does not behave as documented.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please fill in as much as
        you can — a minimal reproduction is by far the most useful part.

        For **security** issues, do not use this form. See
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
      placeholder: |
        I expected useFoldLayout() to report the fold region after unfolding,
        but on a Pixel Fold it stays empty until …
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        The smallest snippet or repo that shows the problem. Please include the
        hooks or components you used and the device (or emulator) and posture.
      render: tsx
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: "@majornutcracker/react-native-fold-layout version"
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: Where does this reproduce?
      multiple: true
      options:
        - iOS
        - Android
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Output of `npx expo-env-info`, or the versions of Expo SDK, React
        Native, and your OS / device (model and fold posture).
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any relevant error output or stack trace.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am using a supported platform (iOS or Android; web is not supported yet).
          required: true
